spring.application.name=auto_flow

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/autoflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:autoflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:autoflow}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:keys/jwt-private.pem}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:keys/jwt-public.pem}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.jwt.issuer=${JWT_ISSUER:auto_flow}
security.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
